name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A second push to the same branch cancels the run already in flight for it,
# so a rapid sequence of commits does not queue up redundant work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Used only by tests against a throwaway database in this workflow. Never a
  # real credential, and never used outside CI.
  DATABASE_URL: postgresql://omnes_app:omnes_ci_password@localhost:5432/omnes_test # omnes:allow-secret, throwaway password for the ephemeral CI-only Postgres container below
  NODE_ENV: test
  LOG_LEVEL: silent
  # getConfig() requires each of these to be at least 32 characters. Fixed,
  # throwaway values that exist only for the lifetime of a CI run - rotating
  # any of them changes nothing real, since no session or token signed with
  # them survives past this workflow.
  JWT_ACCESS_SECRET: ci-only-jwt-access-secret-not-a-real-credential-00 # omnes:allow-secret
  CSRF_SECRET: ci-only-csrf-secret-not-a-real-credential-000000000000 # omnes:allow-secret
  OTP_PEPPER: ci-only-otp-pepper-not-a-real-credential-0000000000000 # omnes:allow-secret
  CORS_ALLOWED_ORIGINS: http://localhost:5173

jobs:
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: scan every tracked file, not only a diff
        run: node scripts/check-secrets.mjs --all

  style-scan:
    name: prose style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: node scripts/check-style.mjs --all

  lint-and-typecheck:
    name: lint and typecheck
    runs-on: ubuntu-latest
    needs: [secret-scan, style-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [secret-scan, style-scan]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omnes_app
          POSTGRES_PASSWORD: omnes_ci_password
          POSTGRES_DB: omnes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnes_app -d omnes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: apply migrations to the ci database
        run: npm run db:migrate:deploy --workspace apps/api
      - run: npm run test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # Fails the build on high or critical advisories. Moderate and below are
      # visible in the log but do not block, since blocking on every moderate
      # finding trains people to stop reading the output.
      - run: npm run audit:ci
