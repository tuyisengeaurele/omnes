name: omnes

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnes_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omnes_dev_only_password}
      POSTGRES_DB: omnes_dev
    ports:
      - "5432:5432"
    volumes:
      - omnes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnes_app -d omnes_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omnes_pgdata:
